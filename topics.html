<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-lang-key="title"></title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<style>
  .page-title {
    background: #FFAE00;
    top: 4%;
    box-shadow: 0vw 0.4vw 0.5vw rgba(0, 0, 0, 0.35);
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    gap: 0.2vw;
  }

  .page-title span {
    color: white;
    font-size: 6vw;
    font-weight: 600;
  }

  .page-title p {
    font-size: 1.5vw !important;
    color: white;
     font-family: "BalooRegular";

    font-weight: lighter!important;

  }

  body[data-lang="hi"] .page-title span,
  body[data-lang="gu"] .page-title span {
    font-size: 5.4vw;
    font-weight: bold;
  }
</style>

<body>
  <a class="home-button home-btn" href="index.html" aria-label="Home">
    <img src="./assets/images/home-btn.png" alt="Home" />
  </a>
  <!-- nav-container -->
  <div class="language-container">
    <div class="english active">E</div>
    <div class="hindi">H</div>
    <div class="gujrati">G</div>
  </div>
  <main>
    <a class="page-title" href="topics.html">
      <span data-lang-key="title"></span>
      <p data-lang-key="sub-title"></p>
    </a>

    <div class="topics">
      <a href="topic-1.html" class="card card-1">
        <img src="./assets/images/topic-1.png" alt="Topic 1" />
        <span data-lang-key="title-1"></span>
      </a>
      <a href="topic-2.html" class="card card-2">
        <img src="./assets/images/topic-2.png" alt="Topic 2" />
        <span data-lang-key="title-2"></span>
      </a>
      <a href="topic-3.html" class="card card-3">
        <img src="./assets/images/topic-3.png" alt="Topic 3" />
        <span data-lang-key="title-3"></span>
      </a>
    </div>
  </main>
  <script src="./assets/js/app.js"></script>

  <script>
    // click sound effects
    const topicClickSound = new Audio("./assets/audio/11.mp3");
    const homeBtnClickSound = new Audio("./assets/audio/pop.mp3");

    function playClickSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(function (err) {
        console.error("Error playing click sound:", err);
      });
    }

    function navigateWithSound(link, audio, delay) {
      link.addEventListener("click", function (e) {
        e.preventDefault();

        const destination = link.getAttribute("href");

        playClickSound(audio);

        setTimeout(function () {
          window.location.href = destination;
        }, delay);
      });
    }

    const homeBtn = document.querySelector(".home-btn");
    const topicCards = document.querySelectorAll(".topics .card");

    if (homeBtn) {
      navigateWithSound(homeBtn, homeBtnClickSound, 1000);
    }

    topicCards.forEach(function (card) {
      navigateWithSound(card, topicClickSound, 1000);
    });
  </script>
</body>

</html>
